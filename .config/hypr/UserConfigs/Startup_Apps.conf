$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts

$wallDIR=$HOME/Pictures/wallpapers
$lock = $scriptsDir/LockScreen.sh
$SwwwRandom = $UserScripts/WallpaperAutoChange.sh
$livewallpaper="$HOME/Pictures/Obsidian-Homepage-mainwallpapers/Live Wallpapers/kuwgrLjt4q-Sequen525522Prob4.mp4"


exec-once = qs -c noctalia-shell

# wallpaper stuff 
exec-once = swww-daemon --format xrgb && swww img $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
# exec-once = mpvpaper -f -o "loop=yes" eDP-1 /home/wael/Videos/wallpaper/liquid-blue-ocean-moewalls-com.mp4

# wallpaper random
#exec-once = $SwwwRandom $wallDIR # random wallpaper switcher every 30 minutes

# Startup
exec-once = dbus-update-activation-environment --systemd WAYLANfocD_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Polkit (Polkit Gnome / KDE)
exec-once = $scriptsDir/Polkit.sh

# starup apps
exec-once = nm-applet --indicator
# exec-once = swaync
# exec-once = AGS_SKIP_V_CHECK=true ags
# exec-once = waybar
# exec-once = quickshell
exec-once = blueman-applet
exec-once = rog-control-center



#clipboard manager
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Rainbow borders
exec-once = $UserScripts/RainbowBorders.sh

# Starting hypridle to start hyprlock
exec-once = hypridle
exec-once = hyprctl reload

# kde connect (phone to pc connectivity)
exec-once = /usr/libexec/kdeconnectd
exec-once = kdeconnect-indicator


#hyperselect
exec-once = hyprctl plugin load /full/qualified/path/to/hyprselect.so
